name: Jobs Spy three-hour cycle

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: jobs-spy-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOBS_DB_PATH: data/jobs.db
      SCRAPE_INTERVAL_HOURS: "3"
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
      NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
      FINDWORK_TOKEN: ${{ secrets.FINDWORK_TOKEN }}
      MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Restore latest valid SQLite artifact
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: kismat-scheduled.yml
        run: |
          mkdir -p data backups restore-tmp
          found=""
          artifact_name=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and (.name | startswith("jobs-db-backup-")))][0].name // empty')
          artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and (.name | startswith("jobs-db-backup-")))][0].id // empty')
          if [ -n "$artifact_name" ] && [ -n "$artifact_id" ]; then
            echo "Restoring artifact $artifact_name (id=$artifact_id)"
            curl --fail --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output restore-tmp/backup.zip
            unzip -q restore-tmp/backup.zip -d restore-tmp
            backup_file=$(find restore-tmp -name '*.db' -type f | head -n 1)
            if [ -n "$backup_file" ]; then
              python scripts/db_backup.py restore --backup "$backup_file" --target data/jobs.db
              echo "database_restored=true" >> "$GITHUB_OUTPUT"
            else
              echo "Artifact contained no SQLite database" >&2
              echo "database_restored=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No previous backup artifact found; starting with repository/migrated data"
            echo "database_restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize and migrate database
        run: |
          python -c "import sys; sys.path.insert(0,'backend'); from db.db import connect,init_db,integrity_check,migrate_legacy_database; migrate_legacy_database('data/jobs.db'); c=connect('data/jobs.db'); init_db(c); c.close(); print(integrity_check('data/jobs.db'))"

      - name: Run one complete scraping cycle
        working-directory: backend
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python main.py --db ../data/jobs.db

      - name: Create consistent SQLite backup
        if: ${{ always() }}
        run: |
          mkdir -p backups
          if [ -f data/jobs.db ]; then
            python scripts/db_backup.py backup \
              --source data/jobs.db \
              --destination "backups/jobs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.db"
            python scripts/db_backup.py check --database "backups/jobs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.db"
          else
            echo "No database exists to back up" >&2
            exit 1
          fi

      - name: Upload SQLite backup artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jobs-db-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: backups/jobs-${{ github.run_id }}-${{ github.run_attempt }}.db
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jobs-spy-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/logs/run.log
          if-no-files-found: ignore
          retention-days: 7
